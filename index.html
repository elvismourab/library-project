<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>My Library</h1>
        <button type="button" id="show-dialog" class="btn-icon" aria-label="Add new book">
            <img src="icons/book-plus.svg" class="icon add-book" alt="" title="Add new book">
        </button>
    </header>
    <main>
        <div id="bookshelf"></div>
        <dialog id="modal-dialog">
            <form id="add-book" action="">
                <h2>Add book</h2>
                <div class="modal-info">
                    <div>
                        <label for="book-title">Title: </label>
                        <input type="text" name="book-title" id="book-title" required>
                    </div>
                    <div>
                        <label for="author">Author: </label>
                        <input type="text" name="author" id="author" required>
                    </div>
                    <div>
                        <label for="pages">Pages: </label>
                        <input type="number" name="pages" id="pages" required>
                    </div>
                    <div>
                        <label for="is-read">Mark as read</label>
                        <input type="checkbox" name="is-read" id="is-read">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel">Cancel</button>
                    <button type="submit" for="add-book">+ add to library</button>
                </div>
            </form>
        </dialog>
    </main>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>My Library</h1>
        <div id="bookshelf"></div>

        <button id="show-dialog">New Book</button>

        <dialog id="modal-dialog">
            <form id="add-book" action="">
                <div>
                    <label for="book-title">Title</label>
                    <input type="text" name="book-title" id="book-title" required>
                </div>
                <div>
                    <label for="author">Author</label>
                    <input type="text" name="author" id="author" required>
                </div>
                <div>
                    <label for="is-read">Mark as read</label>
                    <input type="checkbox" name="is-read" id="is-read">
                </div>
                <button type="button" id="cancel">Cancel</button>
                <button type="submit" for="add-book">+ add to library</button>
            </form>
        </dialog>
    </main>
</body>

</html>
